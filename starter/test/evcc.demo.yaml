# NUR FÜR DEN CI-TEST: simulierte Geräte (feste Werte). Nie in einem echten Haus verwenden.
network:
  schema: http
  host: localhost
  port: 7070
interval: 10s
influx:
  url: http://influxdb:8086
  database: haus
  user: evcc
  password: EVCC_INFLUX_PASSWORT
meters:
  - name: netz
    type: template
    template: demo-meter
    usage: grid
    power: -1500
  - name: pv
    type: template
    template: demo-meter
    usage: pv
    power: 4000
  - name: akku
    type: template
    template: demo-battery
    usage: battery
    power: -1000
    soc: 60
chargers:
  - name: wallbox
    type: template
    template: demo-charger
    status: A
loadpoints:
  - title: Auto
    charger: wallbox
    mode: "off"
site:
  title: Testhaus
  meters:
    grid: netz
    pv:
      - pv
    battery:
      - akku
