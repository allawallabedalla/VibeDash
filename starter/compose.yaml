# VibeDash Starter-Paket (ERSTEINRICHTUNG.md): Datenbank, Universal-Leser und Dashboard auf einem Mini-PC.
# Wird von starter/install.sh gestartet – nicht von Hand bearbeiten; Zugangsdaten stehen in starter/.env (600).
#
#   influxdb  – speichert die Messwerte; kein Port nach außen, nur im internen Netz der Container
#   evcc      – liest Wechselrichter, Akku, Wallbox (Modbus, OCPP, Hersteller-APIs) und schreibt in die Datenbank
#   vibedash  – das Dashboard; liest die Datenbank mit einem Benutzer OHNE Schreibrechte
#   modules   – Werkzeuge mit eigenen Reitern (Wartungsplan, Laden-Wächter …); kein Port nach außen, Inhalte in local/modules
#   forecast  – Sonnen- und Ladeplan-Prognose; rechnet, sobald Anlage und Akku bekannt sind; kein Port nach außen
name: vibedash

services:
  influxdb:
    image: influxdb:1.8.10
    restart: unless-stopped
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: 'true'
      INFLUXDB_DB: haus
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?fehlt}
      INFLUXDB_WRITE_USER: evcc
      INFLUXDB_WRITE_USER_PASSWORD: ${INFLUX_EVCC_PASSWORD:?fehlt}
      INFLUXDB_READ_USER: vibedash
      INFLUXDB_READ_USER_PASSWORD: ${INFLUX_VIBEDASH_PASSWORD:?fehlt}
      INFLUXDB_REPORTING_DISABLED: 'true'
    volumes:
      - influxdb-data:/var/lib/influxdb

  evcc:
    image: evcc/evcc:0.317.1
    restart: unless-stopped
    command: evcc --config /etc/evcc/evcc.yaml
    volumes:
      - ./evcc.yaml:/etc/evcc/evcc.yaml:ro
      - evcc-data:/root/.evcc
    ports:
      # Oberfläche von evcc nur auf diesem Rechner (der Mensch braucht sie nicht)
      - '127.0.0.1:7070:7070'
      # OCPP-Wallboxen verbinden sich hierher (nur Heimnetz, keine Portfreigabe im Router)
      - '8887:8887'
    depends_on:
      - influxdb

  vibedash:
    build: ..
    image: vibedash:local
    restart: unless-stopped
    ports:
      - '${VIBEDASH_PORT:-8095}:8080'
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_DB: haus
      INFLUX_USER: vibedash
      INFLUX_PASSWORD: ${INFLUX_VIBEDASH_PASSWORD:?fehlt}
      EVCC_URL: http://evcc:7070
      MODULES_URL: http://modules:8091
      # PV forecast and charge plan (they start once the plant and the battery are known)
      FORECAST_URL: http://forecast:8090
      # Einrichtungs-Assistent (/#/einrichten): Code vom Installer, evcc-Admin-Passwort, Heimnetz für die Suche
      EVCC_ADMIN_PASSWORD: ${EVCC_ADMIN_PASSWORD:-}
      SETUP_CODE: ${SETUP_CODE:-}
      SCAN_CIDR: ${SCAN_CIDR:-}
      SETUP_DEMO: ${SETUP_DEMO:-off}
      # + vibedash: the charge guard in the modules container reads the plan here
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost},vibedash
      ALLOWED_HOSTS_EXACT: 'on'
      LOCATION_WRITE: 'off'
      LATITUDE: ${LATITUDE:-}
      LONGITUDE: ${LONGITUDE:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./local:/app/local
    depends_on:
      - influxdb
      - evcc
      - modules
      - forecast

  modules:
    build: ../modules
    image: vibedash-modules:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # the charge guard switches the wallbox through evcc (locked until it has proved itself)
      EVCC_ADMIN_PASSWORD: ${EVCC_ADMIN_PASSWORD:-}
    volumes:
      - ./local/modules:/data

  forecast:
    build: ../forecast
    image: vibedash-forecast:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - forecast-data:/data

volumes:
  forecast-data:
  influxdb-data:
  evcc-data:
