name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm budget

  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            playwright-report/
          retention-days: 14

  forecast:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: forecast
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  modules:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
      - run: uvx ruff@0.16.9 format --check .
      - run: uvx ruff@0.16.9 check .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vibedash:ci .
      - name: Smoke test (demo mode)
        run: |
          docker run -d --name vd -p 8080:8080 vibedash:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/api/health | grep -q '"source":"demo"'
          curl -fsS -o /dev/null localhost:8080/
          test "$(docker exec vd id -un)" = node
          docker rm -f vd
      - run: docker build -t vibedash-forecast:ci forecast
      - name: Smoke test forecasting service
        run: |
          docker run -d --name vdf -p 8090:8090 vibedash-forecast:ci
          for i in $(seq 1 30); do curl -fsS localhost:8090/gesund && break; sleep 1; done
          curl -fsS localhost:8090/gesund | grep -q '"ok":true'
          test "$(docker exec vdf id -un)" = app
          docker rm -f vdf
      - run: docker build -t vibedash-modules:ci modules
      - name: Smoke test modules service
        run: |
          mkdir -p /tmp/vdm && cp modules/templates/*.json /tmp/vdm/ && sudo chown -R 1000:1000 /tmp/vdm
          docker run -d --name vdm -p 8091:8091 -v /tmp/vdm:/data vibedash-modules:ci
          for i in $(seq 1 30); do curl -fsS localhost:8091/gesund && break; sleep 1; done
          curl -fsS localhost:8091/gesund | grep -q '"wartung"'
          curl -fsS localhost:8091/board/wartung | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['sections'][0]['title']=='Haus & Wartung', b"
          curl -fsS localhost:8091/feed/wartung/kalender.ics | head -1 | grep -q BEGIN:VCALENDAR
          curl -fsS localhost:8091/gesund | grep -q '"garten"'
          curl -fsS localhost:8091/board/gebaeude | python3 -c "import json,sys; s=json.load(sys.stdin)['sections']; assert s[0]['title']=='Noch kein Ergebnis', s"
          curl -fsS localhost:8091/board/raeume | python3 -c "import json,sys; s=json.load(sys.stdin)['sections'][0]; assert s['type']=='plan' and s['floors'][0]['rooms'], s"
          test "$(docker exec vdm id -u)" = 1000
          docker rm -f vdm

  starter:
    # Starter-Paket auf frischem Ubuntu: Installer, Rechte, dann der Einrichtungs-Assistent über seine API
    # (Demo-Geräte nur hier), evcc schreibt, VibeDash liest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer (erster Lauf)
        run: sudo VIBEDASH_DIR="$GITHUB_WORKSPACE" VIBEDASH_SETUP_DEMO=on VIBEDASH_SCAN_CIDR= bash starter/install.sh
      - name: Datenbank nur intern, Zugangsdaten nur root
        run: |
          ! sudo ss -tln | grep -q ':8086 '
          test "$(sudo stat -c %a starter/.env)" = 600
      - name: Einrichtungs-Assistent verbindet Geräte (über die API wie die Seite)
        run: |
          set -a; . <(sudo cat starter/.env); set +a
          api() { curl -sS -X POST "localhost:8095/api/setup/$1" -H 'Content-Type: application/json' -H 'Origin: http://localhost:8095' -d "$2"; echo; }
          C="\"code\":\"$SETUP_CODE\""
          # falscher Code und fremde Seite werden abgewiesen
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8095/api/setup/unlock -H 'Content-Type: application/json' -H 'Origin: http://localhost:8095' -d '{"code":"000000"}')" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8095/api/setup/unlock -H 'Content-Type: application/json' -H 'Origin: http://evil.example' -d "{$C}")" = 403
          api unlock "{$C}" | grep -q '"ok":true'
          api answers "{$C,\"answers\":{\"own_home\":true,\"read_only\":true,\"no_opening\":true,\"ask_if_unsure\":true}}" | grep -q '"all":true'
          api templates "{$C,\"usage\":\"pv\"}" | python3 -c "import json,sys; t=json.load(sys.stdin)['templates']; print(len(t), 'Vorlagen PV'); assert any(x['template']=='demo-meter' for x in t)"
          api test "{$C,\"usage\":\"pv\",\"template\":\"demo-meter\",\"values\":{\"power\":\"4000\"}}" | tee /dev/stderr | grep -q '"value":4000'
          api save "{$C,\"usage\":\"pv\",\"template\":\"demo-meter\",\"values\":{\"power\":\"4000\"}}" | grep -q '"ok":true'
          api save "{$C,\"usage\":\"grid\",\"template\":\"demo-meter\",\"values\":{\"power\":\"-1500\"}}" | grep -q '"ok":true'
          api save "{$C,\"usage\":\"battery\",\"template\":\"demo-battery\",\"values\":{\"power\":\"-1000\",\"soc\":\"60\"}}" | grep -q '"ok":true'
          api finish "{$C}" | grep -q '"ok":true'
          curl -fsS localhost:8095/api/setup | grep -q '"open":false'
          api test "{$C,\"usage\":\"pv\",\"template\":\"demo-meter\",\"values\":{}}" | grep -q setup_closed
      - name: evcc schreibt, VibeDash liest
        run: |
          set -a; . <(sudo cat starter/.env); set +a
          q() { sudo docker compose -f starter/compose.yaml --env-file starter/.env exec -T influxdb influx -username "$1" -password "$2" -database haus -execute "$3"; }
          for i in $(seq 1 40); do q admin "$INFLUX_ADMIN_PASSWORD" 'SHOW MEASUREMENTS' | grep -qx pvPower && break; sleep 5; done
          q admin "$INFLUX_ADMIN_PASSWORD" 'SHOW MEASUREMENTS'
          for m in pvPower homePower gridPower batteryPower batterySoc; do q admin "$INFLUX_ADMIN_PASSWORD" 'SHOW MEASUREMENTS' | grep -qx "$m"; done
          ! q vibedash "$INFLUX_VIBEDASH_PASSWORD" "DROP MEASUREMENT pvPower" 2>/dev/null
          curl -fsS localhost:8095/api/health | tee /dev/stderr | grep -q '"source":"live"'
          curl -fsS 'localhost:8095/api/series/pv_power?range=24h' | python3 -c "import json,sys; s=json.load(sys.stdin)['samples']; assert s and abs(s[-1][1]-4000)<1, s[-3:]"
          curl -fsS 'localhost:8095/api/series/grid_power?range=24h' | python3 -c "import json,sys; s=json.load(sys.stdin)['samples']; assert s and abs(s[-1][1]-1500)<1, s[-3:]"
      - name: Modul Wartung (Reiter, Abhaken, Kalender-Abo)
        run: |
          curl -fsS localhost:8095/api/health | python3 -c "import json,sys; b=json.load(sys.stdin)['boards']; assert b==[{'id':'wartung','title':'Wartung','icon':'wrench','actions':True}], b"
          for i in $(seq 1 30); do curl -fsS localhost:8095/api/board/wartung >/dev/null && break; sleep 2; done
          curl -fsS localhost:8095/api/board/wartung | python3 -c "import json,sys; b=json.load(sys.stdin); t=[s['title'] for s in b['sections']]; print(t); assert 'Wartungstag: dein Rundgang' in t"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8095/api/board/wartung/action -H 'Content-Type: application/json' -H 'Origin: http://localhost:8095' -d '{"item":"plan:siebe","action":"ack"}')" = 200
          sudo grep -q '"plan:siebe"' starter/local/modules/notizen.json
          curl -fsS localhost:8095/feed/wartung/kalender.ics | head -1 | grep -q BEGIN:VCALENDAR
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8095/feed/andere/kalender.ics)" = 404
      - name: Zweiter Lauf ändert keine Zugangsdaten
        run: |
          before=$(sudo sha256sum starter/.env)
          sudo VIBEDASH_DIR="$GITHUB_WORKSPACE" bash starter/install.sh
          test "$before" = "$(sudo sha256sum starter/.env)"
      - name: Protokoll bei Fehler
        if: failure()
        run: sudo docker compose -f starter/compose.yaml --env-file starter/.env logs --tail 120
